apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[{"apiVersion":"core.kubebrowser.io/v1alpha1","kind":"BrowserSystem","metadata":{"name":"sample"},"spec":{"enableApiService":true,"enableConsolePlugin":true}},{"apiVersion":"core.kubebrowser.io/v1alpha1","kind":"Browser","metadata":{"name":"sample"},"spec":{"started":true,"browserResources":{"requests":{"cpu":"100m","memory":"500Mi"}}}}]'
    capabilities: Seamless Upgrades
    description: "Provides integrated web browsing functionality"
    operators.operatorframework.io/builder: operator-sdk-v1.40.0
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
    operatorframework.io/suggested-namespace: kubebrowser
    operatorframework.io/initialization-resource: '{"apiVersion": "core.kubebrowser.io/v1alpha1","kind": "BrowserSystem","metadata": {"name": "browsersystem"},"spec": {}}'
    # TODO(MOH-34): claim disconnected support once operand images are pinned by digest.
    operators.openshift.io/infrastructure-features: '["proxy-aware"]'
    features.operators.openshift.io/disconnected: "false"
    features.operators.openshift.io/proxy-aware: "true"
    categories: Developer Tools
    repository: https://github.com/kubebrowser/operator
    support: None
    containerImage: ghcr.io/kubebrowser/system-manager:0.1.1
  labels:
    operatorframework.io/os.linux: supported
    operatorframework.io/arch.amd64: supported
    operatorframework.io/arch.arm64: supported
  name: kubebrowser.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions: {}
  description: ""
  displayName: KubeBrowser Operator
  icon:
    - base64data: ""
      mediatype: image/svg+xml
  install:
    spec:
      deployments: []
    strategy: deployment
  installModes:
    - supported: false
      type: OwnNamespace
    - supported: false
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
  keywords:
    - browser
    - web browser
    - kubebrowser
    - chromium
    - testing
  links:
    - name: Github
      url: https://github.com/kubebrowser
  maintainers:
    - email: devmohamed2000@email.com
      name: Mohamed Fall
  maturity: alpha
  provider:
    name: Kubebrowser
    url: https://github.com/kubebrowser
  version: 0.0.1
  minKubeVersion: 1.32.0
